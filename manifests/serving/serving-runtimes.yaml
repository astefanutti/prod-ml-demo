---
# KServe Serving Infrastructure for SmartShop AI
#
# Resources:
#   1. S3 Secret (for adapter download init container)
#   2. ServiceAccount with S3 access
#   3. ServingRuntime: smartshop-vllm-runtime (vLLM + LoRA for LLM)
#   4. ServingRuntime: smartshop-rec-runtime (FastAPI for recommendations)
#   5. InferenceService: smartshop-rec (recommendation model)
#   6. InferenceService: smartshop-llm (Mistral-7B + LoRA adapter via vLLM)
#   7. InferenceService: smartshop-rag (RAG over vector store + LLM)
#   8. ServiceMonitor: smartshop-serving-metrics (Prometheus scraping)
#
# Prerequisites:
#   - Trained rec model at s3://smartshop-models/recommendation/best_model.pt
#   - LoRA adapter at s3://smartshop-models/llm-adapter/
#   - rec-server image pushed to quay.io (via BuildConfig or manual push)
#   - Secrets: smartshop-credentials, hf-credentials
#
# Apply:
#   envsubst < manifests/serving/serving-runtimes.yaml | oc apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: smartshop-s3-serving
  namespace: ${NAMESPACE}
  annotations:
    serving.kserve.io/s3-endpoint: http://minio.${NAMESPACE}.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-verifyssl: "0"
    serving.kserve.io/s3-region: ${AWS_DEFAULT_REGION}
  labels:
    app: smartshop
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartshop-serving-sa
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
secrets:
  - name: smartshop-s3-serving

---
# =============================================================================
# ServingRuntime: vLLM with LoRA support (OpenShift-compatible)
#
# Key fixes from cluster testing:
#   - Uses public vllm/vllm-openai image (RHOAI image needs auth on all nodes)
#   - vLLM loads base model from HF directly (no storageUri — avoids OOM in
#     storage initializer for 15GB model downloads)
#   - emptyDir volumes for /.cache, /.config, /.triton, /.local, /tmp
#     (required on OpenShift — containers run as non-root)
#   - TRITON_CACHE_DIR + XDG_CONFIG_HOME env vars redirect writes
# =============================================================================
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: smartshop-vllm-runtime
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
    component: llm-serving
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8000"
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  protocolVersions: ["v2", "grpc-v2"]
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: kserve-container
      image: ${VLLM_IMAGE}
      command: ["/bin/bash", "-c"]
      args:
        - |
          vllm serve ${LLM_BASE_MODEL} \
            --served-model-name smartshop-llm \
            --port 8000 \
            --host 0.0.0.0 \
            --enable-lora \
            --lora-modules smartshop-qa=/mnt/adapters \
            --max-model-len 4096 \
            --gpu-memory-utilization 0.9 \
            --trust-remote-code \
            --disable-uvicorn-access-log
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: TRANSFORMERS_CACHE
          value: /tmp/hf_home
        - name: TRITON_CACHE_DIR
          value: /tmp/triton_cache
        - name: XDG_CONFIG_HOME
          value: /tmp/config
        - name: XDG_CACHE_HOME
          value: /tmp/xdg_cache
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-credentials
              key: token
        - name: VLLM_LOGGING_LEVEL
          value: INFO
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 300
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 600
        periodSeconds: 30
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: "64Gi"
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: adapters
          mountPath: /mnt/adapters
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /.cache
        - name: local
          mountPath: /.local
        - name: config
          mountPath: /.config
        - name: triton
          mountPath: /.triton
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: "16Gi"
    - name: adapters
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    - name: cache
      emptyDir: {}
    - name: local
      emptyDir: {}
    - name: config
      emptyDir: {}
    - name: triton
      emptyDir: {}

---
# =============================================================================
# ServingRuntime: Recommendation model (custom FastAPI)
# =============================================================================
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: smartshop-rec-runtime
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
    component: rec-serving
spec:
  multiModel: false
  supportedModelFormats:
    - name: custom
      autoSelect: true
  containers:
    - name: kserve-container
      image: ${REC_SERVER_IMAGE}
      imagePullPolicy: Always
      env:
        - name: MODEL_PATH
          value: /mnt/models/best_model.pt
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 15
        periodSeconds: 5
      resources:
        requests:
          cpu: "2"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "16Gi"

---
# =============================================================================
# InferenceService: Recommendation Model
# =============================================================================
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rec
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
    component: rec-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    serviceAccountName: smartshop-serving-sa
    model:
      modelFormat:
        name: custom
      runtime: smartshop-rec-runtime
      storageUri: s3://${S3_MODELS_BUCKET}/recommendation

---
# =============================================================================
# InferenceService: LLM (Mistral-7B + LoRA via vLLM)
#
# Uses RawDeployment with a standalone predictor container (no ServingRuntime).
# vLLM pulls the base model from HF directly. The LoRA adapter is downloaded
# from S3 inline at startup before vLLM launches.
# =============================================================================
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-llm
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
    component: llm-serving
  annotations:
    serving.kserve.io/autoscalerClass: hpa
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 2
    minReplicas: 1
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    containers:
      - name: kserve-container
        image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.13.0}
        command: ["/bin/bash", "-c"]
        args:
          - |
            pip install -q s3fs 2>/dev/null; python3 -c 'import s3fs, os
            ep = os.environ.get("AWS_ENDPOINT_URL_S3","")
            if ep:
                s3 = s3fs.S3FileSystem(endpoint_url=ep,
                    key=os.environ.get("AWS_ACCESS_KEY_ID"),
                    secret=os.environ.get("AWS_SECRET_ACCESS_KEY"))
                s3.get("${S3_MODELS_BUCKET}/llm-adapter/","/mnt/adapters/",recursive=True)
                print("LoRA adapter downloaded to /mnt/adapters")
                for f in os.listdir("/mnt/adapters"): print(f"  {f}")' && vllm serve ${LLM_BASE_MODEL:-mistralai/Mistral-7B-Instruct-v0.3} --served-model-name smartshop-llm --port 8000 --host 0.0.0.0 --enable-lora --lora-modules smartshop-qa=/mnt/adapters --max-model-len 4096 --gpu-memory-utilization 0.9 --trust-remote-code --disable-uvicorn-access-log
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: TRANSFORMERS_CACHE
            value: /tmp/hf_home
          - name: TRITON_CACHE_DIR
            value: /tmp/triton_cache
          - name: XDG_CONFIG_HOME
            value: /tmp/config
          - name: XDG_CACHE_HOME
            value: /tmp/xdg_cache
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: AWS_ENDPOINT_URL_S3
            value: http://minio.${NAMESPACE}.svc.cluster.local:9000
          - name: AWS_DEFAULT_REGION
            value: ${AWS_DEFAULT_REGION:-us-east-1}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-credentials
                key: token
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_SECRET_ACCESS_KEY
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: shm
            mountPath: /dev/shm
          - name: adapters
            mountPath: /mnt/adapters
          - name: tmp
            mountPath: /tmp
          - name: cache
            mountPath: /.cache
          - name: local-vol
            mountPath: /.local
          - name: config
            mountPath: /.config
          - name: triton
            mountPath: /.triton
    volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "16Gi"
      - name: adapters
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: local-vol
        emptyDir: {}
      - name: config
        emptyDir: {}
      - name: triton
        emptyDir: {}

---
# =============================================================================
# InferenceService: RAG (Vector Search + LLM)
# =============================================================================
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rag
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
    component: rag-serving
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    volumes:
      - name: feast-registry-tls
        configMap:
          name: smartshop-service-ca
    containers:
      - name: kserve-container
        image: ${RAG_SERVER_IMAGE}
        imagePullPolicy: Always
        command: ["uvicorn"]
        args: ["serving.rag.server:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: MILVUS_HOST
            value: milvus.${NAMESPACE}.svc.cluster.local
          - name: MILVUS_PORT
            value: "19530"
          - name: LLM_URL
            value: http://smartshop-llm-predictor.${NAMESPACE}.svc.cluster.local/v1/completions
          - name: FEAST_REPO_PATH
            value: /app/feast/feature_repo
          - name: FEAST_CONFIG
            value: feature_store_serving.yaml
          - name: NAMESPACE
            value: "${NAMESPACE}"
        volumeMounts:
          - name: feast-registry-tls
            mountPath: /var/run/secrets/feast-registry-tls
            readOnly: true
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 5
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

---
# =============================================================================
# ServiceMonitor: Prometheus scraping for all serving endpoints
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smartshop-serving-metrics
  namespace: ${NAMESPACE}
  labels:
    app: smartshop
spec:
  selector:
    matchExpressions:
      - key: serving.kserve.io/inferenceservice
        operator: In
        values: [smartshop-rec, smartshop-rag, smartshop-llm]
  namespaceSelector:
    matchNames: [${NAMESPACE}]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s

---
# Kubeflow Trainer - Recommendation Model (DDP on K8s)
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: smartshop-rec-train
  namespace: smartshop
spec:
  runtimeRef:
    name: smartshop-rec-ddp
  trainer:
    image: quay.io/smartshop/rec-trainer:latest
    command:
      - torchrun
    args:
      - --nproc_per_node=1
      - training/recommendation/train.py
      - --data-dir=s3://smartshop/features
      - --output-dir=s3://smartshop/models/recommendation
      - --epochs=10
      - --batch-size=1024
      - --embed-dim=64
    numNodes: 4
    resourcesPerNode:
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: "1"
      limits:
        cpu: "8"
        memory: "32Gi"
        nvidia.com/gpu: "1"

---
# TrainingRuntime for DDP recommendation training
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: smartshop-rec-ddp
  namespace: smartshop
spec:
  template:
    spec:
      replicatedJobs:
        - name: worker
          template:
            spec:
              template:
                spec:
                  containers:
                    - name: trainer
                      env:
                        - name: FEAST_REPO_PATH
                          value: "feast/feature_repo"
                        - name: S3_ENDPOINT
                          value: "http://minio.smartshop.svc.cluster.local:9000"
                      volumeMounts:
                        - name: shm
                          mountPath: /dev/shm
                  volumes:
                    - name: shm
                      emptyDir:
                        medium: Memory
                        sizeLimit: "8Gi"

---
# Kubeflow Trainer - LLM Fine-Tuning (FSDP on Slurm)
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: smartshop-llm-finetune
  namespace: smartshop
spec:
  runtimeRef:
    name: smartshop-llm-fsdp-slurm
    kind: ClusterTrainingRuntime
  trainer:
    image: quay.io/smartshop/llm-trainer:latest
    command:
      - torchrun
    args:
      - --nnodes=2
      - --nproc_per_node=4
      - training/llm/finetune.py
      - --data-dir=s3://smartshop/llm_data
      - --output-dir=s3://smartshop/models/llm-adapter
      - --epochs=3
      - --batch-size=4
      - --gradient-accumulation=4
    numNodes: 2
    resourcesPerNode:
      requests:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "4"
      limits:
        cpu: "32"
        memory: "128Gi"
        nvidia.com/gpu: "4"

---
# ClusterTrainingRuntime for FSDP LLM training dispatched to Slurm
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: smartshop-llm-fsdp-slurm
spec:
  template:
    spec:
      replicatedJobs:
        - name: worker
          template:
            spec:
              template:
                spec:
                  containers:
                    - name: trainer
                      env:
                        - name: HF_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: hf-credentials
                              key: token
                        - name: S3_ENDPOINT
                          value: "http://minio.smartshop.svc.cluster.local:9000"
                        - name: NCCL_DEBUG
                          value: "INFO"
                      volumeMounts:
                        - name: shm
                          mountPath: /dev/shm
                      resources:
                        requests:
                          nvidia.com/gpu: "4"
                  volumes:
                    - name: shm
                      emptyDir:
                        medium: Memory
                        sizeLimit: "32Gi"

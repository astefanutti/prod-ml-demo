apiVersion: batch/v1
kind: Job
metadata:
  name: upload-spark-jars
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 7200
  backoffLimit: 0
  activeDeadlineSeconds: 1800   # 30-min hard limit (RAPIDS JAR is ~850 MB)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: uploader
          image: ${SPARK_JOBS_IMAGE}
          command: ["python3.12", "-c"]
          args:
            - |
              import requests, s3fs, os
              print("=== Spark JAR upload ===", flush=True)

              fs = s3fs.S3FileSystem(
                  key=os.environ["AWS_ACCESS_KEY_ID"],
                  secret=os.environ["AWS_SECRET_ACCESS_KEY"],
                  endpoint_url="http://minio.${NAMESPACE}.svc.cluster.local:9000",
                  use_ssl=False)

              BUCKET = "smartshop-raw"
              JARS = [
                  # S3A JARs — required by all Spark jobs for MinIO access
                  ("jars/hadoop-aws-3.3.4.jar",
                   "https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"),
                  ("jars/aws-java-sdk-bundle-1.12.262.jar",
                   "https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar"),
                  # RAPIDS Accelerator — required by spark-application-rapids.yaml
                  # cuda13 variant: cluster runs CUDA 13.0 (cuda12 JNI can't find libcudart.so.12)
                  # ~850 MB download — allow extra time (see activeDeadlineSeconds above)
                  ("jars/rapids-4-spark-cuda13.jar",
                   "https://repo1.maven.org/maven2/ai/rapids/rapids-4-spark_2.12/26.02.2/rapids-4-spark_2.12-26.02.2-cuda13.jar"),
              ]

              for key, url in JARS:
                  s3path = f"{BUCKET}/{key}"
                  name = key.split("/")[-1]
                  if fs.exists(s3path):
                      print(f"SKIP {name} (already exists)", flush=True); continue
                  print(f"Downloading {name} ...", flush=True)
                  timeout = 1800 if "rapids" in name else 600
                  resp = requests.get(url, stream=True, timeout=timeout)
                  resp.raise_for_status()
                  total = int(resp.headers.get("content-length", 0))
                  downloaded = 0
                  with fs.open(s3path, "wb") as out:
                      for chunk in resp.iter_content(chunk_size=4*1024*1024):
                          out.write(chunk)
                          downloaded += len(chunk)
                          if downloaded % (50*1024*1024) < 4*1024*1024:
                              print(f"  {downloaded/1e6:.0f}/{total/1e6:.0f} MB", flush=True)
                  print(f"DONE: {name} ({downloaded/1e6:.0f} MB)", flush=True)

              print("=== All Spark JARs uploaded to MinIO ===", flush=True)
          envFrom:
            - secretRef:
                name: smartshop-credentials
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 4Gi}

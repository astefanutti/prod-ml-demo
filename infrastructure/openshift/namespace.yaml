---
apiVersion: v1
kind: Namespace
metadata:
  name: smartshop
  labels:
    app.kubernetes.io/part-of: smartshop-ai

---
# MinIO for object storage
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: smartshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: smartshop
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
# Redis for Feast online store
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "1Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartshop
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
# PVC for models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartshop-models
  namespace: smartshop
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi

---
# PVC for MinIO
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: smartshop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

---
# HuggingFace credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: hf-credentials
  namespace: smartshop
type: Opaque
stringData:
  token: "YOUR_HF_TOKEN_HERE"

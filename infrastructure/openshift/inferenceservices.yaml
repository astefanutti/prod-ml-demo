---
# KServe - Recommendation Model
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rec
  namespace: ${NAMESPACE}
  annotations:
    serving.kserve.io/autoscalerClass: hpa
    serving.kserve.io/targetUtilizationPercentage: "80"
spec:
  predictor:
    minReplicas: ${REC_MIN_REPLICAS}
    maxReplicas: ${REC_MAX_REPLICAS}
    containers:
      - name: smartshop-rec
        image: ${REC_SERVER_IMAGE}
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: MODEL_PATH
            value: "${MODEL_PATH}"
          - name: FEAST_REPO_PATH
            value: "${FEAST_REPO_PATH}"
          - name: REDIS_HOST
            value: "${REDIS_HOST}"
          - name: REDIS_PORT
            value: "${REDIS_PORT}"
          - name: MLFLOW_TRACKING_URI
            value: "${MLFLOW_TRACKING_URI}"
          - name: AWS_ENDPOINT_URL_S3
            value: "${MINIO_ENDPOINT}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_DEFAULT_REGION}"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

---
# KServe - LLM (vLLM) for Review Summarization
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-llm
  namespace: ${NAMESPACE}
spec:
  predictor:
    minReplicas: ${LLM_MIN_REPLICAS}
    maxReplicas: ${LLM_MAX_REPLICAS}
    containers:
      - name: vllm
        image: vllm/vllm-openai:v0.6.4  # pinned; upgrade intentionally — latest can break CUDA/model compat
        args:
          - --model
          - ${LLM_BASE_MODEL}
          - --enable-lora
          - --lora-modules
          - smartshop-adapter=${LLM_ADAPTER_PATH}
          - --max-model-len
          - "${MAX_MODEL_LEN}"
          - --gpu-memory-utilization
          - "0.9"
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-credentials
                key: token
          - name: HF_HOME
            value: "${HF_HOME}"
          - name: AWS_ENDPOINT_URL_S3
            value: "${MINIO_ENDPOINT}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_DEFAULT_REGION}"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: "1"

---
# KServe - RAG Q&A Service
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rag
  namespace: ${NAMESPACE}
spec:
  predictor:
    minReplicas: ${RAG_MIN_REPLICAS}
    maxReplicas: ${RAG_MAX_REPLICAS}
    containers:
      - name: smartshop-rag
        image: ${REC_SERVER_IMAGE}
        ports:
          - containerPort: 8002
            protocol: TCP
        env:
          - name: FEAST_REPO_PATH
            value: "${FEAST_REPO_PATH}"
          - name: LLM_URL
            value: "http://smartshop-llm.${NAMESPACE}.svc.cluster.local/v1/completions"
          - name: REDIS_HOST
            value: "${REDIS_HOST}"
          - name: REDIS_PORT
            value: "${REDIS_PORT}"
          - name: MILVUS_HOST
            value: "${MILVUS_HOST}"
          - name: MILVUS_PORT
            value: "${MILVUS_PORT}"
          - name: EMBED_MODEL
            value: "${EMBED_MODEL}"
          - name: AWS_ENDPOINT_URL_S3
            value: "${MINIO_ENDPOINT}"
          - name: AWS_DEFAULT_REGION
            value: "${AWS_DEFAULT_REGION}"
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_ACCESS_KEY_ID
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: smartshop-credentials
                key: AWS_SECRET_ACCESS_KEY
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

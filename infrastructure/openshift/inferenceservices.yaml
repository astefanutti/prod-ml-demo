---
# KServe - Recommendation Model
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rec
  namespace: smartshop
  annotations:
    serving.kserve.io/autoscalerClass: hpa
    serving.kserve.io/targetUtilizationPercentage: "80"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 5
    containers:
      - name: smartshop-rec
        image: quay.io/abdhumal/smartshop-rec-server:latest
        ports:
          - containerPort: 8000
            protocol: TCP
        env:
          - name: MODEL_PATH
            value: "/models/recommendation/best_model.pt"
          - name: FEAST_REPO_PATH
            value: "/feast/feature_repo"
          - name: REDIS_HOST
            value: "redis.smartshop.svc.cluster.local"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
          - name: model-volume
            mountPath: /models
    volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: smartshop-models

---
# KServe - LLM (vLLM) for Review Summarization
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-llm
  namespace: smartshop
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        args:
          - --model
          - mistralai/Mistral-7B-Instruct-v0.3
          - --enable-lora
          - --lora-modules
          - smartshop-adapter=/models/llm-adapter
          - --max-model-len
          - "4096"
          - --gpu-memory-utilization
          - "0.9"
        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-credentials
                key: token
        resources:
          requests:
            cpu: "4"
            memory: "32Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "8"
            memory: "64Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: model-volume
            mountPath: /models
    volumes:
      - name: model-volume
        persistentVolumeClaim:
          claimName: smartshop-models

---
# KServe - RAG Q&A Service
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: smartshop-rag
  namespace: smartshop
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    containers:
      - name: smartshop-rag
        image: quay.io/abdhumal/smartshop-rec-server:latest
        ports:
          - containerPort: 8002
            protocol: TCP
        env:
          - name: FEAST_REPO_PATH
            value: "/feast/feature_repo"
          - name: LLM_URL
            value: "http://smartshop-llm.smartshop.svc.cluster.local/v1/completions"
          - name: REDIS_HOST
            value: "redis.smartshop.svc.cluster.local"
          - name: MILVUS_HOST
            value: "milvus.smartshop.svc.cluster.local"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"

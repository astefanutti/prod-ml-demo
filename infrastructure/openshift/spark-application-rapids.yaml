---
# RAPIDS GPU-Accelerated Feature Engineering Job
# Optional variant of smartshop-feature-engineering with GPU acceleration.
# Requires GPU-equipped executor nodes with NVIDIA device plugin.
# See docs/rapids.md for details.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: smartshop-feature-engineering-rapids
  namespace: smartshop
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "quay.io/smartshop/spark-jobs-rapids:latest"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/feature_engineering.py"
  arguments:
    - "--input"
    - "s3a://smartshop/raw/"
    - "--output"
    - "s3a://smartshop/features/"
    - "--metadata-input"
    - "s3a://smartshop/raw/metadata/"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
  hadoopConf:
    fs.s3a.endpoint: "http://minio.smartshop.svc.cluster.local:9000"
    fs.s3a.access.key: "${MINIO_ACCESS_KEY}"
    fs.s3a.secret.key: "${MINIO_SECRET_KEY}"
    fs.s3a.path.style.access: "true"
    fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
  sparkConf:
    # RAPIDS Accelerator
    spark.plugins: "com.nvidia.spark.SQLPlugin"
    spark.rapids.sql.enabled: "true"
    spark.rapids.sql.concurrentGpuTasks: "2"
    spark.rapids.memory.pinnedPool.size: "2g"
    # GPU resource allocation
    spark.executor.resource.gpu.amount: "1"
    spark.task.resource.gpu.amount: "0.5"
    spark.executor.resource.gpu.discoveryScript: "/opt/spark/getGpusResources.sh"
    # Tuning for GPU execution
    spark.sql.files.maxPartitionBytes: "512m"
    spark.sql.adaptive.enabled: "true"
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark
    envFrom:
      - secretRef:
          name: smartshop-credentials
  executor:
    cores: 4
    instances: 4
    memory: "8g"
    gpu:
      name: "nvidia.com/gpu"
      quantity: 1
    envFrom:
      - secretRef:
          name: smartshop-credentials

---
# feast-spark-engine-rapids ConfigMap
#
# Drop-in replacement for feast-spark-engine when running Feast BFV with RAPIDS GPU workers.
# Switch from local[*] → k8s:// cluster mode with 4 GPU executor pods.
#
# Prerequisites before applying:
#   1. feast-spark-executor image built and pushed:
#        oc start-build feast-spark-executor -n ${NAMESPACE} --follow
#   2. spark ServiceAccount exists with correct RBAC:
#        oc create sa spark -n ${NAMESPACE}
#        oc adm policy add-role-to-user edit -z spark -n ${NAMESPACE}
#
# Apply:
#   envsubst < infrastructure/openshift/feast-spark-engine-rapids.yaml | oc apply -f -
#   oc rollout restart deployment/feast-smartshop-feast -n ${NAMESPACE}
#
# Revert to local[*]:
#   envsubst < infrastructure/openshift/feast-spark-engine.yaml | oc apply -f -
#   oc rollout restart deployment/feast-smartshop-feast -n ${NAMESPACE}
apiVersion: v1
kind: ConfigMap
metadata:
  name: feast-spark-engine
  namespace: ${NAMESPACE}
data:
  config: |
    type: spark.engine
    partitions: 10

    # k8s:// cluster mode — spawns 4 GPU executor pods using feast-spark-executor image
    spark.master: "k8s://${OCP_API_URL}"
    spark.submit.deployMode: "client"
    spark.driver.memory: "8g"
    spark.executor.instances: "4"
    spark.executor.memory: "14g"
    spark.executor.memoryOverhead: "4g"
    spark.executor.cores: "2"

    # RAPIDS GPU plugin — transparent acceleration, no Spark GPU resource scheduling.
    # The RAPIDS JAR is pre-installed in both the driver (feast-spark-server) and executor
    # (feast-spark-executor-rapids) images. No spark.jars needed — avoids the 470MB
    # MinIO download race condition where executor pods connect before the download completes.
    # RAPIDS uses the first available CUDA GPU on each executor node automatically.
    # Driver runs in CPU fallback mode (feast-spark-server has no GPU).
    spark.plugins: "com.nvidia.spark.SQLPlugin"
    spark.rapids.sql.enabled: "true"
    spark.rapids.sql.concurrentGpuTasks: "2"

    # Executor pod image — feast-spark-executor-rapids (CPU executor + RAPIDS JAR on top)
    # Sourced from: FEAST_EXECUTOR_RAPIDS_IMAGE in .env
    spark.kubernetes.container.image: "${FEAST_EXECUTOR_RAPIDS_IMAGE}"
    spark.kubernetes.container.image.pullPolicy: "Always"
    spark.kubernetes.authenticate.driver.serviceAccountName: "spark"
    spark.kubernetes.namespace: "${NAMESPACE}"

    # Pin executor pods to GPU nodes (nvidia.com/gpu.present=true label)
    # Without this, pods land on CPU nodes where CUDA is unavailable → RAPIDS init fails.
    spark.kubernetes.node.selector.nvidia.com/gpu.present: "true"

    # Request 1 GPU per executor — NVIDIA Device Plugin injects CUDA device files into container.
    # vendor=nvidia.com + resource-name=gpu → Kubernetes resource request: nvidia.com/gpu=1
    spark.executor.resource.gpu.amount: "1"
    spark.executor.resource.gpu.vendor: "nvidia.com"
    spark.executor.resource.gpu.discoveryScript: "/opt/spark/getGpusResources.sh"
    # 0.5 GPU per task → 2 tasks share 1 GPU per executor → 2×4 = 8 concurrent tasks.
    # Matches CPU baseline concurrency (executor.cores=2 × 4 pods = 8 tasks).
    # concurrentGpuTasks=2 above tells RAPIDS to schedule 2 GPU kernels simultaneously.
    # Setting this to 1.0 would limit to 4 total tasks (half CPU parallelism) → unfair comparison.
    spark.task.resource.gpu.amount: "0.5"

    # Pass FIPS fix to executor pods
    spark.kubernetes.driverEnv.JAVA_TOOL_OPTIONS: "-Dcom.redhat.fips=false"
    spark.kubernetes.executorEnv.JAVA_TOOL_OPTIONS: "-Dcom.redhat.fips=false"

    spark.ui.enabled: "false"
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://${S3_SPARK_LOGS_BUCKET}/events/"
    spark.sql.session.timeZone: "UTC"
    spark.sql.shuffle.partitions: "400"
    spark.default.parallelism: "400"
    spark.sql.execution.arrow.pyspark.enabled: "true"
    spark.sql.execution.arrow.fallback.enabled: "true"
    spark.sql.execution.arrow.maxRecordsPerBatch: "50000"
    spark.hadoop.fs.s3a.endpoint: "http://minio.${NAMESPACE}.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.connection.maximum: "100"
    spark.hadoop.fs.s3a.threads.max: "64"
    # Driver reachability: bind all interfaces, advertise via stable k8s service FQDN
    spark.driver.bindAddress: "0.0.0.0"
    spark.driver.host: "feast-spark-driver.${NAMESPACE}.svc.cluster.local"
    spark.driver.port: "7078"
    spark.driver.blockManager.port: "7079"
    spark.executor.maxNumFailures: "4"
    spark.task.maxFailures: "4"
    # Allow executor pods extra time to register (large image pull ~47s on cold nodes)
    spark.network.timeout: "600s"
    spark.executor.heartbeatInterval: "60s"
    spark.kubernetes.executor.missingPodDetectDelta: "120s"
    spark.kubernetes.executor.api.pollingInterval: "5000"

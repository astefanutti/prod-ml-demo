---
# BuildConfig — feast-spark-server
# Extends feature-server:0.62.0 with JDK 11 + pyspark==3.5.3 + hadoop-aws JARs.
# JAVA_TOOL_OPTIONS=-Dcom.redhat.fips=false baked in (required on UBI9 for AWS SDK v1 signing).
# Output: internal ImageStream (no Quay push needed — used within the namespace).
# Trigger: oc start-build feast-spark-server -n ${NAMESPACE}
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: feast-spark-server
  namespace: ${NAMESPACE}
spec:
  source:
    type: Git
    git:
      uri: ${GIT_REPO}
      ref: ${GIT_BRANCH}
    contextDir: "."
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: build/Containerfile.feast-spark
      noCache: false
  output:
    to:
      kind: DockerImage
      name: ${REGISTRY}/smartshop-feast-spark-server:latest
    pushSecret:
      name: ${QUAY_PUSH_SECRET}
  resources:
    limits:
      cpu: "4"
      memory: "8Gi"
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2


---
# BuildConfig — spark-jobs
# Trigger: oc start-build spark-jobs -n ${NAMESPACE}
# Output: pushed directly to ${REGISTRY}/smartshop-spark-jobs:latest via ${QUAY_PUSH_SECRET}
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: spark-jobs
  namespace: ${NAMESPACE}
spec:
  source:
    type: Git
    git:
      uri: ${GIT_REPO}
      ref: ${GIT_BRANCH}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: build/Containerfile.spark
      noCache: false
      env:
        - name: UV_CACHE_DIR
          value: /tmp/uv-cache
  output:
    to:
      kind: DockerImage
      name: ${REGISTRY}/smartshop-spark-jobs:latest
    pushSecret:
      name: ${QUAY_PUSH_SECRET}
  resources:
    limits:
      cpu: "4"
      memory: "8Gi"
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2


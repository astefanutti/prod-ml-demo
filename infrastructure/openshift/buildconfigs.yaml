---
# BuildConfig — spark-jobs
# Builds Containerfile.spark from the git repo and pushes to the internal ImageStream.
# Trigger: oc start-build spark-jobs -n smartshop
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: spark-jobs
  namespace: smartshop
spec:
  source:
    type: Git
    git:
      uri: https://github.com/abhijeet-dhumal/prod-ml-demo.git
      ref: refine-cluster-infra-setup
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: build/Containerfile.spark
      noCache: false
      env:
        - name: UV_CACHE_DIR
          value: /tmp/uv-cache
  output:
    to:
      kind: ImageStreamTag
      name: spark-jobs:latest
  resources:
    limits:
      cpu: "4"
      memory: "8Gi"
  successfulBuildsHistoryLimit: 2
  failedBuildsHistoryLimit: 2


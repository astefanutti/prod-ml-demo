---
# FeatureStore CR — SmartShop AI
#
# Uses SparkOfflineStore + SparkComputeEngine (feast-spark-server custom image).
# Services run in one shared Deployment (feast-smartshop-feast).
#
# Init containers are disabled — feast apply and feast materialize are run manually
# via oc exec after the pod starts. This avoids the init container using the default
# feast[minimal] image (which lacks pyspark) when features.py imports SparkSource.
#
# Apply:
#   source .env
#   envsubst < infrastructure/openshift/feast-spark-engine.yaml | oc apply -f -
#   envsubst < infrastructure/openshift/feast-operator.yaml | oc apply -f -
#
# After pod Ready, run feast apply + feast materialize-incremental via oc exec.
# See docs/feast/BFV-DESIGN.md for the full workflow and scripts/wait-and-materialize.sh.
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: smartshop-feast
  namespace: ${NAMESPACE}
  labels:
    feature-store-ui: enabled
spec:
  feastProject: smartshop

  # Git repo where feast/feature_repo lives.
  # Init containers clone this repo to /feast-data/smartshop/feature_repo/
  # and run `feast apply` before the main containers start.
  # Since all service images are overridden to feast-spark-server (which has pyspark),
  # the init container can also import SparkSource and run `feast apply` against
  # the live Parquet files in MinIO.
  feastProjectDir:
    git:
      url: https://github.com/abhijeet-dhumal/prod-ml-demo.git
      ref: ${GIT_BRANCH}
      featureRepoPath: feast/feature_repo

  # batchEngine: injects batch_engine: {type: spark.engine, spark_conf: {...}}
  # into feature_store.yaml via the feast-spark-engine ConfigMap.
  batchEngine:
    configMapRef:
      name: feast-spark-engine

  services:
    offlineStore:
      persistence:
        store:
          # type: spark → SparkOfflineStore; secret key "spark" holds spark_conf
          type: spark
          secretRef:
            name: feast-spark-config
      server:
        # Custom image: feature-server:0.62.0 + pyspark==3.5.3 + Java 11 + hadoop-aws JARs
        # JAVA_TOOL_OPTIONS=-Dcom.redhat.fips=false (FIPS-disabled for AWS SDK v1 S3A signing)
        # Built by: oc start-build feast-spark-server → pushed to ${REGISTRY}/smartshop-feast-spark-server
        image: ${FEAST_SERVER_IMAGE}
        envFrom:
          - secretRef:
              name: feast-s3-credentials  # AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY

    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-redis-secret
      server:
        image: ${FEAST_SERVER_IMAGE}
        envFrom:
          - secretRef:
              name: feast-s3-credentials

    registry:
      local:
        persistence:
          file:
            path: registry.db
            pvc:
              # Reuse existing PVC if already created; operator is idempotent
              create:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 1Gi
                storageClassName: nfs-csi
              mountPath: /feast-registry
        server:
          image: ${FEAST_SERVER_IMAGE}
          envFrom:
            - secretRef:
                name: feast-s3-credentials
          restAPI: true

    ui:
      # image is a top-level field under services.ui (not services.ui.server)
      # UI reads feature_store.yaml — needs feast[spark] to parse offline_store.type: spark
      image: ${FEAST_SERVER_IMAGE}

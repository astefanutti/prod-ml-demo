---
# Kubeflow Spark Operator - Feature Engineering Job
# S3 credentials are injected from the smartshop-credentials Secret via envFrom.
# Update infrastructure/smartshop/credentials.yaml with your MinIO credentials before applying.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: smartshop-feature-engineering
  namespace: smartshop
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "quay.io/smartshop/spark-jobs:latest"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/feature_engineering.py"
  arguments:
    - "--input"
    - "s3a://smartshop-raw/raw/"
    - "--output"
    - "s3a://smartshop-features/"
    - "--metadata-input"
    - "s3a://smartshop-raw/raw/metadata/"
  sparkVersion: "3.5.0"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
  hadoopConf:
    fs.s3a.endpoint: "http://minio.smartshop.svc.cluster.local:9000"
    fs.s3a.access.key: "${MINIO_ACCESS_KEY}"
    fs.s3a.secret.key: "${MINIO_SECRET_KEY}"
    fs.s3a.path.style.access: "true"
    fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark
    envFrom:
      - secretRef:
          name: smartshop-credentials
  executor:
    cores: 4
    instances: 4
    memory: "8g"
    envFrom:
      - secretRef:
          name: smartshop-credentials


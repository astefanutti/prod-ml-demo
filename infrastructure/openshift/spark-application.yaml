---
# Kubeflow Spark Operator - Feature Engineering Job
# S3 credentials are injected from the smartshop-credentials Secret via envFrom.
# hadoopConf reads credentials from AWS_* env vars provided by that secret.
# Apply with: envsubst < infrastructure/openshift/spark-application.yaml | oc apply -f -
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: smartshop-feature-engineering
  namespace: smartshop
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "quay.io/abdhumal/smartshop-spark-jobs:latest"
  imagePullPolicy: Always
  mainApplicationFile: "local:///opt/spark/work-dir/feature_engineering.py"
  arguments:
    - "--input"
    - "s3a://smartshop-raw/raw/"
    - "--output"
    - "s3a://smartshop-features/"
    - "--metadata-input"
    - "s3a://smartshop-raw/raw/metadata/"
  sparkVersion: "3.5.3"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 30
  hadoopConf:
    fs.s3a.endpoint: "http://minio.smartshop.svc.cluster.local:9000"
    fs.s3a.path.style.access: "true"
    fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    # EnvironmentVariableCredentialsProvider reads AWS_ACCESS_KEY_ID and
    # AWS_SECRET_ACCESS_KEY from pod env, which are injected via envFrom below.
    fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.EnvironmentVariableCredentialsProvider"
  driver:
    cores: 2
    memory: "4g"
    serviceAccount: spark
    envFrom:
      - secretRef:
          name: smartshop-credentials
  executor:
    cores: 4
    instances: 4
    memory: "8g"
    envFrom:
      - secretRef:
          name: smartshop-credentials


---
# Spark History Server
#
# Reads compressed event logs from s3a://smartshop-spark-logs/ (MinIO).
# Shows completed and in-progress Spark jobs with full DAG, stage/task breakdown,
# executor metrics, and RAPIDS GPU acceleration details.
#
# Demo value: side-by-side with Ray Dashboard — shows Spark ETL job internals
# (CPU baseline vs RAPIDS GPU) with stage timelines and executor utilization.
#
# SparkApplications write event logs flat into the bucket root:
#   s3a://smartshop-spark-logs/spark-<appId>.zstd
#
# NOTE: History Server does NOT recurse into subdirectories.
# All SparkApplications must use spark.eventLog.dir=s3a://smartshop-spark-logs/
#
# Route: https://spark-history-${NAMESPACE}.${OC_CLUSTER_DOMAIN}/
#
# Apply:
#   envsubst < infrastructure/openshift/spark-history-server.yaml | oc apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: ${NAMESPACE}
  labels:
    app: spark-history-server
    component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
        - name: spark-history-server
          # Same Spark version as ETL jobs — ensures DAG/metrics compatibility
          image: ${SPARK_HISTORY_IMAGE:-docker.io/apache/spark:3.5.3}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              MINIO_URL="http://minio.${NAMESPACE}.svc.cluster.local:9000"

              mkdir -p /tmp/spark-extra-jars /tmp/spark-conf
              echo "Downloading hadoop-aws JARs..."
              curl -fsSL -o /tmp/spark-extra-jars/hadoop-aws-3.3.4.jar \
                "${MINIO_URL}/${S3_RAW_BUCKET}/jars/hadoop-aws-3.3.4.jar"
              curl -fsSL -o /tmp/spark-extra-jars/aws-java-sdk-bundle-1.12.262.jar \
                "${MINIO_URL}/${S3_RAW_BUCKET}/jars/aws-java-sdk-bundle-1.12.262.jar"
              echo "JARs ready: $(ls -sh /tmp/spark-extra-jars/*.jar | tr '\n' ' ')"

              # Write conf with no leading whitespace (heredoc indentation stripped via printf)
              printf '%s\n' \
                "spark.history.fs.logDirectory s3a://${S3_SPARK_LOGS_BUCKET}/events" \
                "spark.history.fs.update.interval 10s" \
                "spark.history.ui.port 18080" \
                "spark.history.retainedApplications 100" \
                "spark.hadoop.fs.s3a.endpoint ${MINIO_URL}" \
                "spark.hadoop.fs.s3a.access.key ${AWS_ACCESS_KEY_ID}" \
                "spark.hadoop.fs.s3a.secret.key ${AWS_SECRET_ACCESS_KEY}" \
                "spark.hadoop.fs.s3a.path.style.access true" \
                "spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem" \
                "spark.hadoop.fs.s3a.connection.ssl.enabled false" \
                "spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider" \
                "spark.hadoop.fs.s3a.metadatastore.impl org.apache.hadoop.fs.s3a.s3guard.NullMetadataStore" \
                > /tmp/spark-conf/spark-defaults.conf

              export SPARK_CONF_DIR=/tmp/spark-conf
              export SPARK_DIST_CLASSPATH="/tmp/spark-extra-jars/*"
              echo "Starting Spark History Server..."
              exec /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: smartshop-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: smartshop-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: SPARK_NO_DAEMONIZE
              value: "true"
          ports:
            - name: history-ui
              containerPort: 18080
              protocol: TCP
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 40
            periodSeconds: 30
      securityContext:
        runAsNonRoot: true

---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: ${NAMESPACE}
  labels:
    app: spark-history-server
spec:
  selector:
    app: spark-history-server
  ports:
    - name: history-ui
      port: 18080
      targetPort: 18080
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spark-history
  namespace: ${NAMESPACE}
  labels:
    app: spark-history-server
    component: observability
spec:
  host: spark-history-${NAMESPACE}.${OC_CLUSTER_DOMAIN}
  to:
    kind: Service
    name: spark-history-server
  port:
    targetPort: history-ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None

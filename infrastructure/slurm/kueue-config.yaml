---
# Kueue ResourceFlavor for Slurm GPU nodes
apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: slurm-a100
spec:
  nodeLabels:
    node.kubernetes.io/instance-type: slurm-a100
    slinky.x-k8s.io/cluster: gpu-cluster

---
# Kueue ClusterQueue for Slurm GPU workloads
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: slurm-gpu-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: slurm-a100
          resources:
            - name: "cpu"
              nominalQuota: 128
            - name: "memory"
              nominalQuota: 512Gi
            - name: "nvidia.com/gpu"
              nominalQuota: 16

---
# Kueue LocalQueue in smartshop namespace
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: slurm-gpu-queue
  namespace: smartshop
spec:
  clusterQueue: slurm-gpu-cluster-queue

---
# Consolidated credentials secret for all SmartShop infrastructure components.
# Reference in any pod/TrainJob/InferenceService via:
#   envFrom:
#   - secretRef:
#       name: smartshop-credentials
apiVersion: v1
kind: Secret
metadata:
  name: smartshop-credentials
  namespace: smartshop
  labels:
    app: smartshop
type: Opaque
stringData:
  # MinIO / S3
  MINIO_ENDPOINT: "http://minio.smartshop.svc.cluster.local:9000"
  MINIO_ENDPOINT_EXTERNAL: "${MINIO_ENDPOINT_EXTERNAL}"
  MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
  MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
  MINIO_REGION: "${AWS_DEFAULT_REGION}"
  # Redis (Feast online store)
  REDIS_HOST: "redis.smartshop.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis.smartshop.svc.cluster.local:6379"
  # Milvus (vector store)
  MILVUS_HOST: "milvus.smartshop.svc.cluster.local"
  MILVUS_PORT: "19530"

---
# Consolidated credentials secret for all SmartShop infrastructure components.
# Reference in any pod/TrainJob/InferenceService via:
#   envFrom:
#   - secretRef:
#       name: smartshop-credentials
apiVersion: v1
kind: Secret
metadata:
  name: smartshop-credentials
  namespace: smartshop
  labels:
    app: smartshop
type: Opaque
stringData:
  # MinIO / S3
  MINIO_ENDPOINT: "http://minio.smartshop.svc.cluster.local:9000"
  MINIO_ENDPOINT_EXTERNAL: "https://minio-s3-smartshop.apps.<cluster-domain>"
  MINIO_ACCESS_KEY: "<your-minio-access-key>"
  MINIO_SECRET_KEY: "<your-minio-secret-key>"
  MINIO_REGION: "us-east-1"
  # Redis (Feast online store)
  REDIS_HOST: "redis.smartshop.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "<your-redis-password>"
  REDIS_URL: "redis://:<your-redis-password>@redis.smartshop.svc.cluster.local:6379"
  # Milvus (vector store)
  MILVUS_HOST: "milvus.smartshop.svc.cluster.local"
  MILVUS_PORT: "19530"

---
# PostgreSQL backend for MLflow.
# Uses the OpenShift-native postgresql:15-el9 imagestream — handles arbitrary UIDs
# without anyuid SCC. Env var names follow the RHSCL convention (POSTGRESQL_*, not POSTGRES_*).
#
# MLflow operator reads the backend URI from `mlflow-postgres-secret` in
# redhat-ods-applications. That secret must point to this service:
#   postgresql+psycopg2://<your-pg-user>:<your-pg-password>@postgres.smartshop.svc.cluster.local:5432/mlflow
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: smartshop
stringData:
  POSTGRESQL_USER: "${PG_USER}"
  POSTGRESQL_PASSWORD: "${PG_PASSWORD}"
  POSTGRESQL_DATABASE: "${PG_DATABASE}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: smartshop
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: smartshop
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: image-registry.openshift-image-registry.svc:5000/openshift/postgresql:15-el9
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: smartshop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

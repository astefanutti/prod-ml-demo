---
# Feast operator FeatureStore CR for OpenShift
# Manages Feast server lifecycle, online/offline stores
apiVersion: feast.dev/v1alpha1
kind: FeatureStore
metadata:
  name: smartshop-feast
  namespace: smartshop
spec:
  feastProject: smartshop
  services:
    offlineStore:
      persistence:
        file:
          path: s3://smartshop/feast/offline/
          s3AdditionalKwargs:
            endpoint_url: "http://minio.smartshop.svc.cluster.local:9000"
    onlineStore:
      persistence:
        store:
          type: redis
          redis:
            connectionString: "redis.smartshop.svc.cluster.local:6379"
    registry:
      local:
        path: s3://smartshop/feast/registry.db

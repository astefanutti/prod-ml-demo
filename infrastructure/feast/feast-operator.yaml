---
# MinIO S3 credentials injected into all Feast server pods.
# Feast uses AWS_ENDPOINT_URL_S3 (fsspec/pyarrow) for the custom MinIO endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: feast-s3-credentials
  namespace: smartshop
stringData:
  AWS_ACCESS_KEY_ID: "<your-minio-access-key>"
  AWS_SECRET_ACCESS_KEY: "<your-minio-secret-key>"
  AWS_ENDPOINT_URL_S3: "http://minio.smartshop.svc.cluster.local:9000"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_FORCE_PATH_STYLE: "true"
---
# Redis online store config. The Feast operator reads the key matching the store
# type ("redis") and merges it into the generated feature_store.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: feast-redis-secret
  namespace: smartshop
stringData:
  redis: |
    type: redis
    connection_string: "redis.smartshop.svc.cluster.local:6379,password=<your-redis-password>"
---
# FeatureStore CR — deployed by the RHOAI Feast Operator (feast.dev/v1, Feast 0.60.0).
#
# Registry   : NFS shared PVC  → /feast-data/feast/registry.db
# Offline    : dask (file/parquet) reading s3://smartshop-features/ from MinIO
# Online     : Redis (password auth via feast-redis-secret)
# Project src: GitHub repo, feast/feature_repo/ sub-directory
apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: smartshop-feast
  namespace: smartshop
  labels:
    feature-store-ui: enabled    # required: surfaces this FeatureStore in the RHOAI dashboard
spec:
  feastProject: smartshop

  # Clone our public repo; featureRepoPath points to feast/feature_repo/
  # which contains features.py with S3-based FileSources.
  feastProjectDir:
    git:
      url: https://github.com/abhijeet-dhumal/prod-ml-demo.git
      ref: refine-cluster-infra-setup
      featureRepoPath: feast/feature_repo

  services:
    # ---- Offline store ----
    # dask type — reads Parquet from S3 (MinIO) in-memory; no local PVC needed.
    # S3 credentials injected so fsspec/pyarrow can reach MinIO.
    offlineStore:
      persistence:
        file:
          type: dask
      server:
        envFrom:
          - secretRef:
              name: feast-s3-credentials

    # ---- Online store (Redis) ----
    onlineStore:
      persistence:
        store:
          type: redis
          secretRef:
            name: feast-redis-secret
      server:
        envFrom:
          - secretRef:
              name: feast-s3-credentials

    # ---- Registry ----
    # Dedicated 1Gi NFS PVC — avoids double-mounting smartshop-shared-storage
    # in the same pod (NFS CSI can't remount the same PV twice per pod).
    registry:
      local:
        persistence:
          file:
            path: registry.db
            pvc:
              create:
                accessModes: [ReadWriteOnce]
                storageClassName: nfs-csi
                resources:
                  requests:
                    storage: 1Gi
              mountPath: /feast-registry
        server:
          restAPI: true
          envFrom:
            - secretRef:
                name: feast-s3-credentials

    # ---- UI (optional, useful for Summit demo) ----
    ui: {}

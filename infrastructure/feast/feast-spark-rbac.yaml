---
# RBAC for the `spark` ServiceAccount in the smartshop namespace.
#
# In k8s:// distributed mode (SparkComputeEngine), the Feast driver pod calls
# the Kubernetes API directly to create executor pods. The `spark` SA is used
# for those executor pods and also by SparkApplication CRs (if Spark Operator is in use).
#
# The `edit` ClusterRole grants full read/write on workloads (pods, configmaps,
# services) inside the namespace — sufficient for Spark to:
#   1. Create executor pods (spark-executor-<uuid>)
#   2. Create/delete executor ConfigMaps
#   3. Create services for executor block-manager registration
#
# Note: feast-smartshop-feast SA (created by Feast Operator) does NOT need extra RBAC
# when running materialize via `oc exec`. Only executor pods use the `spark` SA.
#
# Apply:
#   oc apply -f infrastructure/smartshop/spark-rbac.yaml
#   (this file is a reference copy — the canonical is infrastructure/smartshop/spark-rbac.yaml)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: smartshop
  labels:
    app: smartshop
    component: spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spark-smartshop
  labels:
    app: smartshop
    component: spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: smartshop

# feature_store_training.yaml — used exclusively by the rec-trainer pod
#
# Key differences from feature_store.yaml:
#   - registry.registry_type: remote  (reads from feast gRPC server, no PVC needed)
#   - No batch_engine / online_store   (training only needs offline reads)
#   - Baked into the rec-trainer image at /feast/feature_repo/feature_store.yaml
#
# MinIO endpoint is cluster-internal; credentials come from smartshop-credentials secret.

project: smartshop
provider: local

registry:
  registry_type: remote
  # RHOAI Feast Operator exposes registry on port 443 (OpenShift service CA TLS, targetPort 6571)
  path: feast-smartshop-feast-registry.smartshop.svc.cluster.local:443
  cert: /var/run/secrets/service-ca/service-ca.crt

offline_store:
  type: spark
  spark_conf:
    spark.master: "local[*]"
    spark.api.mode: "classic"
    spark.ui.enabled: "false"
    spark.eventLog.enabled: "false"
    spark.sql.session.timeZone: "UTC"
    spark.sql.execution.arrow.pyspark.enabled: "true"
    spark.sql.execution.arrow.fallback.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.default.parallelism: "200"
    spark.driver.memory: "8g"
    spark.executor.memory: "8g"
    spark.sql.execution.arrow.maxRecordsPerBatch: "50000"
    # UBI9 FIPS blocks AWS SDK HMAC signing without this
    spark.driver.extraJavaOptions: "-Dcom.redhat.fips=false"
    spark.hadoop.fs.s3a.endpoint: "http://minio.smartshop.svc.cluster.local:9000"
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.impl: "org.apache.hadoop.fs.s3a.S3AFileSystem"
    spark.hadoop.fs.s3a.aws.credentials.provider: "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.connection.maximum: "100"
    spark.hadoop.fs.s3a.threads.max: "64"
  staging_location: "s3://smartshop-features/feast-staging/"

entity_key_serialization_version: 3

auth:
  type: no_auth
